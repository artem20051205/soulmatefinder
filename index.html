          <!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Random Heart JS</title>

<style>
.left {
  width: 80px;
  height: 120px;
  display: block;
  border-top-right-radius: 50%;
  border-top-left-radius: 50%;
  transform: rotate(-50deg);
  left: 60px;
  position: absolute;

  background: linear-gradient(
    50deg,
    rgb(233, 1, 1) 20%,
    rgba(87, 199, 133, 1) 50%,
    rgba(237, 221, 83, 1) 100%
  );
}

.right {
  width: 80px;
  height: 120px;
  display: block;
  position: absolute;
  top: 0;
  left: 100px;
  border-top-right-radius: 50%;
  border-top-left-radius: 50%;
  transform: rotate(50deg);

  background: linear-gradient(
    -50deg,
    rgb(226, 6, 6) 20%,
    rgba(87, 199, 133, 1) 50%,
    rgba(237, 221, 83, 1) 100%
  );
}

.heart {
  position: relative;
  width: 200px;
  height: 150px;
}
</style>
</head>

<body>

<div class="heart">
  <span class="left"></span>
  <span class="right"></span>
</div>

<script>
  // Één random percentage voor links & rechts
  const rand = Math.floor(Math.random() * (40 - 5 + 1)) + 5;

  document.querySelector('.left').style.background =
    `linear-gradient(
      50deg,
      rgb(233, 1, 1) ${rand}%,
      rgba(87, 199, 133, 1) 50%,
      rgba(237, 221, 83, 1) 100%
    )`;

  document.querySelector('.right').style.background =
    `linear-gradient(
      -50deg,
      rgb(226, 6, 6) ${rand}%,
      rgba(87, 199, 133, 1) 50%,
      rgba(237, 221, 83, 1) 100%
    )`;
</script>

</body>
</html>
